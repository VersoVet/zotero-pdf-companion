<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>PDF Companion Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            min-width: 400px;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
        }
        h3 {
            margin: 20px 0 10px 0;
            font-size: 14px;
            color: #555;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .form-row label {
            font-weight: bold;
            width: 100px;
            flex-shrink: 0;
        }
        .form-row input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        #pdfcompanion-server-host {
            width: 180px;
        }
        #pdfcompanion-server-port {
            width: 80px;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover {
            background: #e5e5e5;
        }
        button.primary {
            background: #0066cc;
            color: white;
            border-color: #0055aa;
        }
        button.primary:hover {
            background: #0055aa;
        }
        #pdfcompanion-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            background: #f9f9f9;
            border: 1px solid #eee;
        }
        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>PDF Companion Settings</h2>

    <h3>Server Configuration</h3>

    <div class="form-row">
        <label for="pdfcompanion-server-host">Server Host:</label>
        <input type="text" id="pdfcompanion-server-host" placeholder="10.0.0.44" />
    </div>

    <div class="form-row">
        <label for="pdfcompanion-server-port">ZM Port:</label>
        <input type="number" id="pdfcompanion-server-port" placeholder="8451" />
    </div>
    <div class="info-text">Paper Reader uses port 8462 on the same host</div>

    <div class="button-row">
        <button id="pdfcompanion-save-btn" class="primary">Save</button>
    </div>

    <h3>Test Connections</h3>

    <div class="button-row">
        <button id="pdfcompanion-test-zm-btn">Test Zotero Manager</button>
        <button id="pdfcompanion-test-pr-btn">Test Paper Reader</button>
    </div>

    <div id="pdfcompanion-status">Ready</div>

    <script src="options.js"></script>
</body>
</html>
